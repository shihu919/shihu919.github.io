<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>致芮的一封信</title>
<style>
  :root{
    --bg: hsl(30 40% 96%);
    --card: hsl(340 60% 97%);
    --fg: hsl(345 35% 20%);
    --muted: hsl(345 20% 45%);
    --primary: hsl(345 70% 55%);
    --primary-fg: #fff;
    --accent: hsl(340 60% 92%);
    --border: hsl(340 30% 85%);
    --serif: "Noto Serif SC","SimSun",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%;font-family:var(--serif);color:var(--fg);background:var(--bg)}
  body{
    background:
      radial-gradient(1200px 600px at 20% 10%, hsl(340 60% 94% / .6), transparent 60%),
      radial-gradient(1000px 500px at 90% 90%, hsl(30 50% 92% / .7), transparent 60%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;padding:24px 16px;
  }
  .stage{position:relative;width:100%;max-width:640px}

  /* 信封封面 */
  .envelope-wrap{display:flex;flex-direction:column;align-items:center}
  .envelope{
    position:relative;width:100%;aspect-ratio:4/3;border-radius:6px;overflow:hidden;
    background:linear-gradient(135deg,#f3e9df,#efe2d3,#e7d6c2);
    box-shadow:0 20px 50px -20px rgba(80,40,40,.35),0 6px 14px rgba(80,40,40,.12);
  }
  .env-back{position:absolute;inset:0;background:linear-gradient(135deg,#f6ece2,#ead9c6)}
  .env-flap{
    position:absolute;left:0;right:0;top:0;height:50%;
    background:linear-gradient(180deg,#f1e4d5,#e3d0bb);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;transition:transform .6s ease, opacity .4s ease;
    z-index:30;
  }
  .env-open .env-flap{transform:rotateX(180deg);opacity:0}
  .env-side-l,.env-side-r{
    position:absolute;top:0;height:50%;width:50%;z-index:10;
    transition:transform .5s ease;
  }
  .env-side-l{left:0;transform-origin:left center;background:linear-gradient(135deg,#efe1cf,#e0ccb6);clip-path:polygon(0 0,100% 100%,0 100%)}
  .env-side-r{right:0;transform-origin:right center;background:linear-gradient(225deg,#efe1cf,#e0ccb6);clip-path:polygon(100% 0,100% 100%,0 100%)}
  .env-open .env-side-l{transform:scaleX(0)}
  .env-open .env-side-r{transform:scaleX(0)}
  .env-bottom{
    position:absolute;left:0;right:0;bottom:0;height:50%;z-index:20;
    background:linear-gradient(180deg,#f4e9dc,#e9d7c2);transform-origin:bottom;transition:transform .6s ease .15s;
  }
  .env-open .env-bottom{transform:scaleY(0)}
  .env-seal{
    position:absolute;left:50%;top:50%;z-index:40;width:64px;height:64px;transform:translate(-50%,-50%);
    border-radius:8px;background:#fff;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--primary);
    box-shadow:0 4px 10px rgba(80,40,40,.15);transition:transform .3s,opacity .3s;
  }
  .env-open .env-seal{transform:translate(-50%,-50%) scale(0);opacity:0}
  .env-seal svg{width:26px;height:26px}
  .env-letter-preview{
    position:absolute;left:24px;right:24px;top:24px;bottom:24px;z-index:0;border-radius:4px;background:#fffaf3;
    box-shadow:inset 0 0 20px rgba(120,80,80,.08);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#9a7b6a;
    transition:transform .8s cubic-bezier(.4,0,.2,1) .2s, opacity .4s;
  }
  .env-open .env-letter-preview{transform:translateY(-65%) scale(1.02)}
  .open-btn{
    margin-top:28px;padding:12px 32px;border:none;border-radius:999px;
    background:linear-gradient(135deg,#b56575,#9a4a5c);color:#fff;font-family:var(--serif);font-size:16px;
    cursor:pointer;box-shadow:0 8px 18px -6px rgba(154,74,92,.55);transition:transform .2s, box-shadow .2s;
  }
  .open-btn:hover{transform:translateY(-2px);box-shadow:0 12px 22px -6px rgba(154,74,92,.6)}
  .open-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .env-tip{margin-top:14px;color:var(--muted);font-size:14px}

  /* 信纸阅读态 */
  .reader{display:none;flex-direction:column;align-items:center}
  .reader.show{display:flex}
  .pager{margin-bottom:16px}
  .pager span{
    display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);
    padding:5px 14px;border-radius:999px;font-size:13px;color:var(--muted);
    box-shadow:0 2px 8px rgba(80,40,40,.06);backdrop-filter:blur(6px);
  }
  .pager span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}

  .book{position:relative;width:100%;perspective:1600px}
  .page{
    position:relative;width:100%;border-radius:6px;overflow:hidden;
    border:1px solid var(--border);
    background:linear-gradient(180deg,#fdf8f0,#fffaf3,#fdf8f0);
    box-shadow:0 22px 50px -22px rgba(80,40,40,.4),0 8px 18px rgba(80,40,40,.1);
  }
  .page::before{
    content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
    background-image:repeating-linear-gradient(transparent,transparent 31px,rgba(120,80,90,.12) 31px,rgba(120,80,90,.12) 32px);
  }
  .page::after{content:"";position:absolute;left:32px;top:0;bottom:0;width:1px;background:rgba(120,80,90,.25)}
  .page-inner{position:relative;padding:40px 36px 44px}
  @media(min-width:640px){.page-inner{padding:56px 64px 60px}.page::after{left:48px}}
  .page-title{text-align:center;font-size:22px;font-weight:600;color:var(--fg);margin-bottom:28px;letter-spacing:2px}
  .page-body{font-size:16px;line-height:2;color:#5a3f37}
  @media(min-width:640px){.page-body{font-size:17px}}
  .page-body p{text-indent:2em;margin-bottom:14px}
  figure{cursor:pointer;overflow:hidden;border-radius:6px;border:1px solid var(--border);box-shadow:0 6px 14px rgba(80,40,40,.12);transition:transform .4s}
  figure:hover{transform:scale(1.03)}
  figure img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
  figcaption{background:#fbf3ea;padding:6px 10px;text-align:center;font-size:12px;color:var(--muted)}
  .fig-left{float:left;margin:0 20px 12px 0;width:150px}
  .fig-right{float:right;margin:0 0 12px 20px;width:150px}
  .fig-center{margin:0 auto 22px;max-width:320px}
  @media(min-width:640px){.fig-left,.fig-right{width:200px}.fig-center{max-width:380px}}
  .clearfix::after{content:"";display:block;clear:both}

  /* 翻页动画 */
  .flip-enter{animation:flipIn .55s cubic-bezier(.4,0,.2,1)}
  @keyframes flipIn{from{opacity:0;transform:rotateY(var(--rot,40deg)) translateX(var(--tx,-40px))}to{opacity:1;transform:none}}

  .controls{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;margin-top:24px}
  .nav-btn{
    display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;
    border:1px solid var(--border);background:rgba(255,255,255,.85);color:#6a4a40;cursor:pointer;
    font-family:var(--serif);font-size:14px;transition:all .2s;backdrop-filter:blur(6px);
  }
  .nav-btn:hover:not(:disabled){background:#fff;transform:translateY(-1px)}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed}
  .dots{display:flex;gap:8px}
  .dot{width:8px;height:8px;border-radius:999px;border:none;background:var(--border);cursor:pointer;transition:all .3s}
  .dot.active{width:22px;background:var(--primary)}

  /* 灯箱 */
  .lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,15,20,.82);z-index:100;padding:24px}
  .lightbox.show{display:flex}
  .lightbox img{max-width:92vw;max-height:86vh;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .lb-close{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:999px;border:none;background:rgba(255,255,255,.9);color:#6a4a40;font-size:22px;cursor:pointer}

  /* 音乐按钮 */
  .music-btn{position:fixed;right:16px;top:16px;width:42px;height:42px;border-radius:999px;border:none;background:rgba(255,255,255,.8);color:var(--primary);font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(80,40,40,.15);backdrop-filter:blur(6px);z-index:50;display:none}
  .music-btn.show{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>
<div class="stage">
  <!-- 信封封面 -->
  <div class="envelope-wrap" id="envWrap">
    <div class="envelope" id="env">
      <div class="env-back"></div>
      <div class="env-letter-preview">
        <div style="font-size:20px;letter-spacing:3px">见字如面</div>
        <div style="width:40px;height:1px;background:#caa"></div>
        <div style="font-size:12px;letter-spacing:1px">A Letter for You</div>
      </div>
      <div class="env-side-l"></div>
      <div class="env-side-r"></div>
      <div class="env-bottom"></div>
      <div class="env-flap"></div>
      <div class="env-seal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
      </div>
    </div>
    <button class="open-btn" id="openBtn">打开信件</button>
    <p class="env-tip">一封写给你的信，慢慢读</p>
  </div>

  <!-- 信纸阅读态 -->
  <div class="reader" id="reader">
    <div class="pager"><span id="pageIndicator">第 1 页 / 共 8 页</span></div>
    <div class="book">
      <div class="page" id="pageEl">
        <div class="page-inner" id="pageInner"></div>
      </div>
    </div>
    <div class="controls">
      <button class="nav-btn" id="prevBtn">‹ 上一页</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn" id="nextBtn">下一页 ›</button>
    </div>
  </div>
</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">×</button>
  <img id="lbImg" alt="放大查看" />
</div>

<button class="music-btn" id="musicBtn" title="音乐">♪</button>

<script>
const PAGES = [
  {title:"致最好的你",paragraphs:[
    "没想到我也会给女生写信。",
    "按照时间来算，我们已经认识、同时也分开三年了——那是我的整个初中生涯。",
    "要是不出意外的话，你看到这封信时应该是5月31日，那个令人难忘的日子。",
    "当然了，我还是要带着真切的感情对你说一句：对不起。"
  ]},
  {title:"相识",paragraphs:[
    "在我们认识的一年半里，我们成了无话不谈的好朋友。",
    "要是回到2023年6月17号，见到你的那一眼，我会怎么想呢？",
    "我是真没想到，当年七月我就开始想你的生日，想我们俩会是什么样的关系——互删？或者只是普通网友？",
    "那时候的事，现在想起来，还是觉得很奇妙。"
  ]},
  {title:"错过的日子",paragraphs:[
    "就算我们还是朋友，那过年呢？因为个人原因，我离开了你。",
    "你的生日，我无法当面表达祝福，但我仍在远方祝福你。",
    "还有我们认识的一周年呢？",
    "没想到都挺下来了。现在眼瞅着认识并离开三年、与你给我写信两年的日子也要到了。",
    "时间过得真快啊。"
  ]},
  {title:"有你在的日子",paragraphs:[
    "有你在的日子，我每天真的很开心。",
    "虽然有时候我们会有内耗，也会有一些问题在里面——对不起，我的个人原因影响到了你。",
    "希望以后我们可以互相告诉对方自己的想法，这真的有助于解决问题的关键。",
    "我也会对你敞开心扉，希望我们都可以彼此真心对待对方。"
  ]},
  {title:"心里话",paragraphs:[
    "现在回想起来，我感觉我那时像个心理变态一样，我的想法只会压抑在心中，宣泄在游戏里。",
    "因为这层心理原因，我和你之间有着隔阂，是我的原因。",
    "说了这么多，我就要说说自己的缺点和真心话了。",
    "我其实真的没有像别人所说的那么好，我敏感多疑，甚至有点自卑。"
  ]},
  {title:"容貌与朋友",paragraphs:[
    "我的容貌确实不出众。",
    "怎会呢？若并非如此，你是如何让我过目不忘，甚是想念直至现在呢？",
    "虽然只是嘴上说说，但我真的破防了。",
    "不过说实话，谁会因为别人对自己容貌的评价而不在意呢？但我有你们。"
  ]},
  {title:"有你们真好",paragraphs:[
    "在我向你们诉说的时候，你们都回来安慰我，让我不要去在意这些。",
    "哈哈哈，她们一直在骂别人，说我漂亮。",
    "有你们的世界我真的很开心。",
    "现在我唯一可以敞开心扉的只有你和她们了，我唯一可以说别人坏话的也只有你们三个了。",
    "我的世界没有你们，真的不行。"
  ]},
  {title:"写在最后",paragraphs:[
    "我真的每天都在想你，有的时候真的忍不住跟你发消息说想你。",
    "虽然你也说想我，不过我不知道是不是只是为了回复我的消息。",
    "怎么会呢？真心我不会辜负，我也不会敷衍你，全心全意为你，18小时专线为你而开。",
    "好了不写那么多了，以后的故事由我们慢慢续写。",
    "不知这些文字你是否还记得，这可是珍藏已久的信。",
    "而我现在所写的，是回信，也是坦白信。"
  ]},
  {title:"后面的故事",paragraphs:[
    "既然是坦白信，那我就说说我的感受吧。",
    "或许我们曾经的关系可以称得上是暧昧。",
    "但暧昧它犹如薛定谔的猫，你永远都无法知道下一刻会发生什么。",
    "暧昧让人受尽委屈，它永远是一类的假设。",
    "记得初见你时，是百般青涩的时候，隔着一层玻璃。",
    "我的耳根不免会感到热热的，嘴角总带有一丝笑容。",
    "那是我最快乐的时候，因为我体会到一个人等着另一个人的感受。"
  ]},
  {title:"阴天",paragraphs:[
    "阳光刺射久后，难免会有阴云来降温。",
    "你发现我开始回你消息变慢了，时不时才回复你。",
    "是的，是我浸没在游戏里，没有时间回复你，冷落了你。",
    "那时懵懂，错过了你最需要陪伴的时候。",
    "你也会听闻我曾经的事，对我有了一次次的改观。",
    "随后的时间里我们变得冷清，没有了互动。",
    "不久后的盛夏。",
    "那对我而言如晴天霹雳发的消息出现了。",
    "你知道吗，那时的我何止是震惊啊，更是笑出了声，还拿自己打趣道。",
    "因为我知道是我做错了，我的世界里将少了一位重要的人。"
  ]},
  {title:"雨天",paragraphs:[
    "你能体谅我的雨天，偶尔胆怯你都了解。",
    "这是我爱的歌，也是最想说的话。",
    "你曾说麦恩莉，可后来才发现你是下雨时的屋檐。",
    "那个寒假，在寒风中我们说了最刺骨的话，如寒锋般。",
    "自那之后我们彻底没了联系，直至现在。"
  ]},
  {title:"晴天",paragraphs:[
    "其实那时我和你争论是想让你对我的注意不在那么高。",
    "临近人生大考的你，这时定要努力。我是这么认为。",
    "我的存在无疑是你前进路上需要避免的存在。所以我选择了这极端的做法",
    "对不起，是我太过自私了，没考虑你的感受。",
    "但说真的，我好累，在你的面前我需要时刻注意自己的言语与行为。",
    "只因我认为我在你心中应该保持完美形象，只有这样才可以满足我心中的期许。",
    "曾经在我眼前，却又消失不见，这是今天的第六遍。",
    "卢广仲的我爱你，道尽了我现在所有的思绪。"
  ]},
  {title:"现在",paragraphs:[
    "困于漩涡，久寻同类。",
    "历经坏天气和雨天，慢慢开始懂了。",
    "放下我怀念的，迎着逆光奔赴。",
    "喧嚣散尽，收获安宁。",
    "终于懂得那我要的幸福，是天黑黑里向往的安稳。"
  ]},
  {title:"写在最后",paragraphs:[
    "不知为何，那沉寂的过往又被拾回。",
    "这本是在我中考前于5.18日便要完成的，直到现在才再拾起。",
    "自中考完后，我的世界获得了安宁，是真的安宁，寻找不到同类。",
    "说来惭愧，我的心理似是出了毛病。",
    "到现在才好些，这也是我现在才续写的原因。",
    "过去那么久了，但我任然给你写，你定会感到惊讶吧。",
    "先冷落你的人是我，先删你的人是我，对你忽冷忽热的人是我，最对不住你的人是我。",
    "所以我不奢望我们能回到过去，我只求在解释完所有之后能在你心里有个好印象吧。",
    "突然发现向人寻求解释，把话说开，越来越像你了。",
    "感谢你，芮，你的存在，是我最大的幸运。",
    "祝学业顺遂，金榜题名。",
    "自冷漠无情的人"
  ]}
];

const fallback = i => "https://picsum.photos/seed/loveletter" + i + "/600/450";

const envWrap = document.getElementById('envWrap');
const env = document.getElementById('env');
const openBtn = document.getElementById('openBtn');
const reader = document.getElementById('reader');
const pageEl = document.getElementById('pageEl');
const pageInner = document.getElementById('pageInner');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dotsBox = document.getElementById('dots');
const indicator = document.getElementById('pageIndicator');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbClose = document.getElementById('lbClose');

let current = 0;
let opened = false;

// 页码点
PAGES.forEach((_, i) => {
  const b = document.createElement('button');
  b.className = 'dot' + (i === 0 ? ' active' : '');
  b.setAttribute('aria-label', '第 ' + (i+1) + ' 页');
  b.onclick = () => { go(i); };
  dotsBox.appendChild(b);
});

function render(){
  const p = PAGES[current];
  let figHtml = '';
  if(p.img){
    const cls = 'fig-' + p.pos;
    figHtml = '<figure class="' + cls + '" data-src="' + p.img + '">' +
      '<img src="' + p.img + '" alt="' + (p.cap||'') + '" onerror="this.onerror=null;this.src=\'' + fallback(current+1) + '\'" />' +
      (p.cap ? '<figcaption>' + p.cap + '</figcaption>' : '') +
      '</figure>';
  }
  const paras = p.paragraphs.map(t => '<p>' + t + '</p>').join('');
  let body;
  if(p.pos === 'left') body = figHtml + paras;
  else if(p.pos === 'right') body = paras + figHtml;
  else body = figHtml + paras;
  pageInner.innerHTML = '<div class="page-title">' + p.title + '</div>' +
    '<div class="page-body clearfix">' + body + '</div>';
  indicator.textContent = '第 ' + (current+1) + ' 页 / 共 ' + PAGES.length + ' 页';
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === PAGES.length - 1;
  Array.from(dotsBox.children).forEach((d,i)=>d.classList.toggle('active', i===current));
  // 翻页动画
  pageEl.classList.remove('flip-enter');
  void pageEl.offsetWidth;
  pageEl.style.setProperty('--rot', current > (pageEl._last ?? 0) ? '40deg' : '-40deg');
  pageEl.style.setProperty('--tx', current > (pageEl._last ?? 0) ? '-40px' : '40px');
  pageEl.classList.add('flip-enter');
  pageEl._last = current;
  // 图片点击放大
  pageInner.querySelector('figure')?.addEventListener('click', e => {
    const src = e.currentTarget.getAttribute('data-src');
    lbImg.src = src;
    lightbox.classList.add('show');
  });
}

function go(i){
  if(i < 0 || i >= PAGES.length || i === current) return;
  current = i;
  render();
}

prevBtn.onclick = () => go(current - 1);
nextBtn.onclick = () => go(current + 1);
lbClose.onclick = () => lightbox.classList.remove('show');
lightbox.onclick = e => { if(e.target === lightbox) lightbox.classList.remove('show'); };
document.addEventListener('keydown', e => {
  if(!opened) return;
  if(e.key === 'ArrowLeft') go(current-1);
  if(e.key === 'ArrowRight') go(current+1);
  if(e.key === 'Escape') lightbox.classList.remove('show');
});

// ========== 音乐 ==========
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');
bgMusic.volume = 0.55;
let musicStarted = false;
function tryPlay() {
  const p = bgMusic.play();
  if (p && typeof p.catch === 'function') {
    p.then(() => {
      musicStarted = true;
      musicBtn.textContent = '♪';
      musicBtn.title = '播放中，点击静音';
      musicBtn.classList.add('show');
    }).catch(err => {
      musicStarted = false;
      musicBtn.textContent = '🔇';
      musicBtn.title = '点击开启音乐';
      musicBtn.classList.add('show');
    });
  } else {
    musicStarted = true;
    musicBtn.textContent = '♪';
    musicBtn.classList.add('show');
  }
}
bgMusic.addEventListener('error', () => {
  musicBtn.title = '音乐加载失败';
  musicBtn.textContent = '⚠';
  musicBtn.classList.add('show');
});
musicBtn.onclick = () => {
  if (!musicStarted) { tryPlay(); return; }
  if (bgMusic.muted) {
    bgMusic.muted = false;
    musicBtn.textContent = '♪';
    musicBtn.title = '播放中，点击静音';
  } else {
    bgMusic.muted = true;
    musicBtn.textContent = '🔇';
    musicBtn.title = '已静音，点击恢复';
  }
};

openBtn.onclick = () => {
  if(opened) return;
  opened = true;
  openBtn.disabled = true;
  tryPlay();
  env.classList.add('env-open');
  setTimeout(() => {
    envWrap.style.display = 'none';
    reader.classList.add('show');
    render();
  }, 1400);
};
</script>
